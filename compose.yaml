name: al-commerce

x-php: &php
  image: al-commerce-php:development
  build:
    context: .
    target: development
    args:
      APP_UID: ${DOCKER_UID:-1000}
      APP_GID: ${DOCKER_GID:-1000}
  init: true
  working_dir: /var/www/html
  environment:
    APP_URL: ${DOCKER_APP_URL:-http://localhost:${DOCKER_APP_PORT:-8080}}
    DB_CONNECTION: mysql
    DB_URL: ""
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DOCKER_DB_DATABASE:-al_commerce}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-al_commerce_app}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-local-development-only}
    SESSION_COOKIE: al_commerce_docker_session
    LARAVEL_VITE_HOT_FILE: /var/www/html/storage/framework/vite.hot
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap-cache:/var/www/html/bootstrap/cache
    - assets:/var/www/html/public/build
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *php
    healthcheck:
      test: [CMD, app-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - assets:/var/www/html/public/build:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/up]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-al_commerce}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-al_commerce_app}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-local-root-only}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  vite:
    image: al-commerce-vite:development
    build:
      context: .
      target: vite-development
      args:
        APP_UID: ${DOCKER_UID:-1000}
        APP_GID: ${DOCKER_GID:-1000}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    init: true
    working_dir: /var/www/html
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:${DOCKER_APP_PORT:-8080}}
      LARAVEL_VITE_HOT_FILE: /var/www/html/storage/framework/vite.hot
      DOCKER_VITE_HOST: ${DOCKER_VITE_HOST:-localhost}
      DOCKER_VITE_PORT: ${DOCKER_VITE_PORT:-5175}
      npm_config_cache: /tmp/npm-cache
    command: [sh, -c, 'npm ci --ignore-scripts && exec node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173 --strictPort']
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5175}:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
      - storage:/var/www/html/storage
      - assets:/var/www/html/public/build
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  scheduler:
    <<: *php
    command: [php, artisan, schedule:work, --no-interaction]
    stop_grace_period: 70s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.29
    profiles: [mailpit]
    ports:
      - "127.0.0.1:${DOCKER_MAILPIT_PORT:-8025}:8025"

volumes:
  mysql:
  vendor:
  storage:
  bootstrap-cache:
  node-modules:
  assets:
